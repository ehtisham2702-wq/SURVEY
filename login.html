<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Public Survey</title>
<style>
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0; color: #fff;
  }
  .login-box {
    background: rgba(0,0,0,0.75);
    padding: 30px;
    border-radius: 12px;
    width: 320px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  }
  h2 { text-align: center; color:#00ffcc; }
  input {
    width: 100%; padding: 10px; margin: 10px 0;
    border-radius: 8px; border: none; font-size: 15px;
  }
  button {
    width: 100%; padding: 10px; border: none;
    background: #00ffcc; color: #000;
    border-radius: 8px; font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #00cc99; }
  .error { color: #ff4444; text-align:center; font-size:14px; }
</style>
</head>
<body>
  <div class="login-box">
    <h2>Login Panel</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Enter Username" required>
      <input type="password" id="password" placeholder="Enter Password" required>
      <button type="submit">Login</button>
      <p id="errorMsg" class="error"></p>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e){
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if(user === "admin" && pass === "12345"){
        localStorage.setItem("loggedIn", "true");
        window.location.href = "index.html"; 
      } else {
        document.getElementById("errorMsg").textContent = "Invalid username or password!";
      }
    });
  </script>
</body>
</html>
